<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Life Gamification</title>
    
    <!-- Configurações para PWA (App no celular) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1e1e">
    
    <style>
        :root {
            --bg-color: #1e1e1e;
            --panel-bg: #2d2d2d;
            --text-main: #f0f0f0;
            --text-muted: #aaaaaa;
            --accent-green: #4caf50;
            --accent-blue: #2196f3;
            --accent-red: #f44336;
            --border: #444;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .header {
            text-align: center;
            padding: 20px;
            background: var(--panel-bg);
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            position: relative;
        }
        .score-display {
            font-size: 3em;
            font-weight: bold;
            color: var(--accent-green);
        }
        .btn-reset {
            margin-top: 10px;
            background: transparent;
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85em;
            transition: all 0.2s;
        }
        .btn-reset:hover {
            background: var(--accent-red);
            color: white;
        }
        .container {
            display: block;
        }
        
        /* Menu Lateral (Sidebar) */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 999;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .sidebar-overlay.open {
            display: block;
            opacity: 1;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 260px;
            height: 100%;
            background: var(--panel-bg);
            border-right: 1px solid var(--border);
            transition: left 0.3s ease;
            z-index: 1000;
            padding-top: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }
        .sidebar.open {
            left: 0;
        }
        .sidebar-header {
            font-size: 1.5em;
            font-weight: bold;
            padding: 0 20px 20px 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 10px;
        }
        .sidebar a {
            display: block;
            padding: 15px 20px;
            color: white;
            text-decoration: none;
            font-size: 1.1em;
            border-bottom: 1px solid #333;
            transition: 0.2s;
        }
        .sidebar a:hover, .sidebar a.active {
            background: #333;
            color: var(--accent-blue);
            border-left: 4px solid var(--accent-blue);
        }
        .panel {
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        h2 {
            margin-top: 0;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }
        .item-list {
            list-style: none;
            padding: 0;
            max-height: 400px;
            overflow-y: auto;
        }
        .item {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 12px;
            background: #333;
            margin-bottom: 8px;
            border-radius: 4px;
            border-left: 4px solid var(--accent-blue);
        }
        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .item-notes {
            display: none;
            width: 100%;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #555;
            color: var(--text-muted);
            font-size: 0.9em;
            white-space: pre-wrap;
            box-sizing: border-box;
        }
        .item.reward {
            border-left: 4px solid var(--accent-red);
        }
        .item-info {
            display: flex;
            flex-direction: column;
        }
        .item-title {
            font-weight: bold;
        }
        .item-points {
            font-size: 0.85em;
            color: var(--text-muted);
        }
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.8; }
        .btn-task { background: var(--accent-blue); color: white; }
        .btn-reward { background: var(--accent-red); color: white; }
        .btn-reward:disabled { background: #555; cursor: not-allowed; }
        
        .btn-delete {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 8px 12px;
        }
        .btn-delete:hover {
            background: var(--accent-red);
            color: white;
            border-color: var(--accent-red);
        }
        .action-group {
            display: flex;
            gap: 8px;
        }

        .add-form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
        }
        input {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: #222;
            color: white;
        }
        input[type="text"] { flex-grow: 1; }
        input[type="number"] { width: 80px; }
        .btn-add { background: var(--accent-green); color: white; }

        .btn-history {
            margin-top: 10px;
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--text-muted);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85em;
            transition: all 0.2s;
            margin-left: 10px;
        }
        .btn-history:hover {
            background: #444;
        }
        .history-panel {
            margin-top: 20px;
            background: #222;
            border-radius: 8px;
            padding: 10px;
            max-height: 250px;
            overflow-y: auto;
            text-align: left;
            border: 1px solid var(--border);
        }
        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 0.9em;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 5px;
            border-bottom: 1px solid #333;
        }
        .history-item:last-child {
            border-bottom: none;
        }
        .history-date {
            color: var(--text-muted);
            font-size: 0.8em;
            width: 130px;
        }
        .history-name {
            flex-grow: 1;
            padding: 0 10px;
        }
        .history-points.earn { color: var(--accent-green); font-weight: bold; }
        .history-points.spend { color: var(--accent-red); font-weight: bold; }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="loginContent" class="header" style="text-align: center; margin-top: 50px;">
        <h1 style="font-size: 2em; margin-bottom: 10px;">Life Gamification</h1>
        <p style="color: var(--text-muted); margin-bottom: 30px;">Faça login para sincronizar seus pontos e tarefas na nuvem.</p>
        <button class="btn-task" style="font-size: 1.2em; padding: 12px 24px;" onclick="login()">Entrar com Google</button>
    </div>

    <!-- APP PRINCIPAL (Oculto inicialmente) -->
    <div id="appContent" style="display: none;">
        <!-- Menu Lateral -->
        <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleMenu()"></div>
        <div id="sidebar" class="sidebar">
            <div class="sidebar-header">Menu Principal</div>
            <a href="#" id="tabTarefas" class="active" onclick="showTab('tarefas')">🎯 Tarefas</a>
            <a href="#" id="tabRecompensas" onclick="showTab('recompensas')">🎁 Recompensas</a>
        </div>

        <div class="header">
            <!-- Cabeçalho com botão de Sair -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 15px;">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <button onclick="toggleMenu()" style="background:none; border:none; color:white; font-size:1.5em; cursor:pointer;">☰</button>
                    <h1 style="margin: 0; font-size: 1.5em;">Life Gamification</h1>
                </div>
                <div style="font-size: 0.85em; color: var(--text-muted);">
                    <span id="userEmail"></span>
                    <button class="btn-delete" style="padding: 4px 8px; margin-left: 10px;" onclick="logout()">Sair</button>
                </div>
            </div>
            
            <h2 style="margin: 0; font-size: 1.2em; color: var(--text-muted);">Saldo de Pontos</h2>
            <div class="score-display" id="totalPoints">0</div>
            <div>
                <button class="btn-reset" onclick="resetPoints()">Zerar Pontos</button>
                <button id="toggleHistoryBtn" class="btn-history" onclick="toggleHistory()">Ver Detalhes</button>
            </div>
            
            <!-- Painel de Histórico (Oculto por padrão) -->
            <div id="historyPanel" class="history-panel" style="display: none;">
                <ul class="history-list" id="historyList"></ul>
            </div>
        </div>

        <div class="container">
        <!-- TAREFAS -->
        <div class="panel" id="panelTarefas">
            <h2>Tarefas (Gerar Pontos)</h2>
            <ul class="item-list" id="taskList"></ul>
            <form class="add-form" id="formTask" style="flex-direction: column;">
                <div style="display: flex; gap: 10px; width: 100%;">
                    <input type="text" id="taskName" placeholder="Nova Tarefa" required style="flex-grow: 1;">
                    <input type="number" id="taskPoints" placeholder="Pts" required min="1" style="width: 70px;">
                    <select id="taskFrequency" required style="padding: 8px; border-radius: 4px; border: 1px solid var(--border); background: #222; color: white;">
                        <option value="Diária">Diária</option>
                        <option value="Semanal">Semanal</option>
                        <option value="Quinzenal">Quinzenal</option>
                        <option value="Mensal">Mensal</option>
                    </select>
                </div>
                <textarea id="taskNotes" placeholder="Anotações sobre a tarefa (opcional)..." style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid var(--border); background: #222; color: white; resize: vertical; min-height: 60px; box-sizing: border-box;"></textarea>
                <button type="submit" class="btn-add" style="width: 100%; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer;">Adicionar Nova Tarefa</button>
            </form>
        </div>

        <!-- RECOMPENSAS -->
        <div class="panel" id="panelRecompensas" style="display: none;">
            <h2>Recompensas (Gastar Pontos)</h2>
            <ul class="item-list" id="rewardList"></ul>
            <form class="add-form" id="formReward" style="flex-direction: column;">
                <div style="display: flex; gap: 10px; width: 100%;">
                    <input type="text" id="rewardName" placeholder="Nova Recompensa" required style="flex-grow: 1;">
                    <input type="number" id="rewardPoints" placeholder="Custo (Pts)" required min="0" style="width: 80px;">
                </div>
                
                <div style="margin-top: 10px; font-size: 0.9em; color: var(--text-muted);">
                    <label>Exige gastar tarefas específicas? (Opcional):</label>
                    <div id="rewardPrereqs" style="max-height: 100px; overflow-y: auto; background: #222; border: 1px solid var(--border); padding: 5px; border-radius: 4px; margin-top: 5px;">
                        <!-- O JavaScript vai preencher os checkboxes aqui -->
                    </div>
                </div>

                <button type="submit" class="btn-add" style="width: 100%; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px;">Adicionar Recompensa</button>
            </form>
        </div>
    </div>
    </div> <!-- Fim do appContent -->

    <!-- Importação do Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAAXavuACBZMB0gn8v_kiXTJHWNeRfq0TM",
            authDomain: "life-gamification-665a1.firebaseapp.com",
            projectId: "life-gamification-665a1",
            storageBucket: "life-gamification-665a1.firebasestorage.app",
            messagingSenderId: "480270492857",
            appId: "1:480270492857:web:99c137382072f22795e768"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        let userDocRef = null;

        // Dados Iniciais Baseados nas Planilhas
        const defaultTasks = [
            { id: 1, name: "Exemplo: Beber 2L de água", points: 10, frequency: "Diária", notes: "Lembrar de encher a garrafa grande de manhã e deixar na mesa de trabalho." },
            { id: 2, name: "Exemplo: Ler 15 páginas de um livro", points: 30, frequency: "Diária" },
            { id: 3, name: "Exemplo: Fazer faxina na casa", points: 100, frequency: "Semanal" },
            { id: 4, name: "Exemplo: Pagar as contas", points: 50, frequency: "Mensal" }
        ];

        const defaultRewards = [
            { id: 1, name: "Exemplo: Comer uma sobremesa", points: 100 },
            { id: 2, name: "Exemplo: Ir ao cinema", points: 500 },
            { id: 3, name: "Exemplo: Comprar algo que eu quero muito", points: 2000 }
        ];

        // Estado da Aplicação
        let state = {
            totalPoints: 0,
            tasks: [],
            rewards: [],
            history: []
        };

        // Monitor de Login e Sincronização em Tempo Real
        auth.onAuthStateChanged((user) => {
            const loginContent = document.getElementById('loginContent');
            const appContent = document.getElementById('appContent');
            
            if (user) {
                // Usuário logado
                loginContent.style.display = 'none';
                appContent.style.display = 'block';
                document.getElementById('userEmail').innerText = user.email;
                
                userDocRef = db.collection('users').doc(user.uid);
                
                // Ouve as mudanças da nuvem em tempo real
                userDocRef.onSnapshot((doc) => {
                    if (doc.exists) {
                        state = doc.data();
                        if (!state.history) state.history = [];
                    } else {
                        state.tasks = [...defaultTasks];
                        state.rewards = [...defaultRewards];
                        state.history = [];
                        state.totalPoints = 0;
                        saveState();
                    }
                    render();
                });
            } else {
                // Usuário deslogado
                loginContent.style.display = 'block';
                appContent.style.display = 'none';
                userDocRef = null;
            }
        });

        function login() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(err => alert("Erro ao fazer login: " + err.message));
        }

        function logout() {
            auth.signOut();
        }

        function saveState() {
            if (userDocRef) {
                userDocRef.set(state);
            }
        }

        // Ações de Pontuação
        function completeTask(taskId) {
            const task = state.tasks.find(t => t.id === taskId);
            if (task) {
                state.totalPoints += task.points;
                task.completions = (task.completions || 0) + 1;
                const date = new Date().toLocaleString('pt-BR');
                state.history.unshift({ type: 'earn', name: task.name, points: task.points, date: date });
                saveState();
                render();
            }
        }

        function redeemReward(rewardId) {
            const reward = state.rewards.find(r => r.id === rewardId);
            if (reward) {
                let hasAllPrereqs = true;
                if (reward.prereqs && reward.prereqs.length > 0) {
                    reward.prereqs.forEach(prereqId => {
                        const t = state.tasks.find(t => t.id === parseInt(prereqId));
                        if (!t || (t.completions || 0) < 1) hasAllPrereqs = false;
                    });
                }
                
                if (state.totalPoints >= reward.points && hasAllPrereqs) {
                    state.totalPoints -= reward.points;
                    
                    if (reward.prereqs) {
                        reward.prereqs.forEach(prereqId => {
                            const t = state.tasks.find(t => t.id === parseInt(prereqId));
                            if (t) t.completions -= 1;
                        });
                    }
                    
                    const date = new Date().toLocaleString('pt-BR');
                    state.history.unshift({ type: 'spend', name: reward.name, points: reward.points, date: date });
                    saveState();
                    render();
                } else {
                    alert("Você não possui os requisitos (pontos ou tarefas) para esta recompensa!");
                }
            }
        }

        function resetPoints() {
            const confirmed = confirm("⚠️ AVISO DE SEGURANÇA ⚠️\n\nTem certeza que deseja zerar TODOS os seus pontos? Essa ação não poderá ser desfeita.");
            if (confirmed) {
                state.totalPoints = 0;
                state.history = [];
                saveState();
                render();
            }
        }

        function toggleNotes(id) {
            const notesDiv = document.getElementById('notes-' + id);
            if (notesDiv) {
                notesDiv.style.display = (notesDiv.style.display === 'block') ? 'none' : 'block';
            }
        }

        // Ações de Exclusão
        function deleteTask(id) {
            if (confirm("Tem certeza que deseja apagar esta tarefa?")) {
                state.tasks = state.tasks.filter(task => task.id !== id);
                saveState();
                render();
            }
        }

        function deleteReward(id) {
            if (confirm("Tem certeza que deseja apagar esta recompensa?")) {
                state.rewards = state.rewards.filter(reward => reward.id !== id);
                saveState();
                render();
            }
        }

        // Adicionar Novos Itens
        document.getElementById('formTask').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('taskName').value;
            const points = parseInt(document.getElementById('taskPoints').value);
            const frequency = document.getElementById('taskFrequency').value;
            const notes = document.getElementById('taskNotes').value;
            state.tasks.push({ id: Date.now(), name, points, frequency, notes });
            saveState();
            this.reset();
            render();
        });

        document.getElementById('formReward').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('rewardName').value;
            const points = parseInt(document.getElementById('rewardPoints').value);
            
            const checkboxes = document.querySelectorAll('input[name="prereq"]:checked');
            const prereqs = Array.from(checkboxes).map(cb => parseInt(cb.value));
            
            state.rewards.push({ id: Date.now(), name, points, prereqs });
            saveState();
            this.reset();
            render();
        });

        // Renderização da Interface
        function render() {
            document.getElementById('totalPoints').innerText = state.totalPoints;

            // Renderizar Tarefas
            const taskList = document.getElementById('taskList');
            taskList.innerHTML = '';
            
            const frequencies = ['Diária', 'Semanal', 'Quinzenal', 'Mensal'];
            
            frequencies.forEach(freq => {
                const tasksInFreq = state.tasks.filter(t => (t.frequency || 'Diária') === freq);
                
                if (tasksInFreq.length > 0) {
                    const freqHeader = document.createElement('h3');
                    freqHeader.innerText = freq;
                    freqHeader.style.color = 'var(--text-muted)';
                    freqHeader.style.fontSize = '0.9em';
                    freqHeader.style.textTransform = 'uppercase';
                    freqHeader.style.margin = '15px 0 5px 0';
                    freqHeader.style.borderBottom = '1px solid #333';
                    freqHeader.style.paddingBottom = '5px';
                    taskList.appendChild(freqHeader);
                    
                    tasksInFreq.forEach(task => {
                        const li = document.createElement('li');
                        li.className = 'item';
                        li.innerHTML = `
                            <div class="item-header">
                                <div class="item-info">
                                    <span class="item-title">${task.name}</span>
                                    <span class="item-points">+${task.points} Pts</span>
                                </div>
                                <div class="action-group">
                                    ${task.notes ? `<button class="btn-delete" onclick="toggleNotes(${task.id})" title="Ver Anotações">📝</button>` : ''}
                                    <button class="btn-task" onclick="completeTask(${task.id})">Feito</button>
                                    <button class="btn-delete" onclick="deleteTask(${task.id})" title="Remover Tarefa">X</button>
                                </div>
                            </div>
                            ${task.notes ? `<div class="item-notes" id="notes-${task.id}">${task.notes}</div>` : ''}
                        `;
                        taskList.appendChild(li);
                    });
                }
            });

            // Atualizar formulário de recompensas (Pré-requisitos)
            const prereqContainer = document.getElementById('rewardPrereqs');
            if (prereqContainer) {
                prereqContainer.innerHTML = '';
                if (state.tasks.length === 0) {
                    prereqContainer.innerHTML = '<span style="color: #666;">Nenhuma tarefa cadastrada.</span>';
                } else {
                    state.tasks.forEach(task => {
                        const label = document.createElement('label');
                        label.style.display = 'block';
                        label.style.marginBottom = '5px';
                        label.style.cursor = 'pointer';
                        const checkedCount = task.completions || 0;
                        label.innerHTML = `<input type="checkbox" name="prereq" value="${task.id}" style="margin-right: 5px;"> ${task.name} <span style="color: var(--accent-blue); font-size: 0.8em;">(Saldo: ${checkedCount})</span>`;
                        prereqContainer.appendChild(label);
                    });
                }
            }

            // Renderizar Recompensas
            const rewardList = document.getElementById('rewardList');
            rewardList.innerHTML = '';
            state.rewards.forEach(reward => {
                let missingPrereqs = [];
                let hasAllPrereqs = true;
                
                if (reward.prereqs && reward.prereqs.length > 0) {
                    reward.prereqs.forEach(prereqId => {
                        const t = state.tasks.find(t => t.id === parseInt(prereqId));
                        if (!t || (t.completions || 0) < 1) {
                            hasAllPrereqs = false;
                            missingPrereqs.push(t ? t.name : "Tarefa excluída");
                        }
                    });
                }
                
                const canAffordPoints = state.totalPoints >= reward.points;
                const canRedeem = canAffordPoints && hasAllPrereqs;
                
                let statusText = '';
                if (!canRedeem) {
                    let reasons = [];
                    if (!canAffordPoints) reasons.push('Pontos');
                    if (!hasAllPrereqs) reasons.push('Tarefas: ' + missingPrereqs.join(', '));
                    statusText = `<div style="font-size: 0.75em; color: var(--accent-red); margin-top: 5px;">Falta: ${reasons.join(' | ')}</div>`;
                }

                const li = document.createElement('li');
                li.className = 'item reward';
                li.innerHTML = `
                    <div class="item-info">
                        <span class="item-title">${reward.name}</span>
                        <span class="item-points">-${reward.points} Pts</span>
                        ${statusText}
                    </div>
                    <div class="action-group">
                        <button class="btn-reward" ${!canRedeem ? 'disabled' : ''} onclick="redeemReward(${reward.id})">Resgatar</button>
                        <button class="btn-delete" onclick="deleteReward(${reward.id})" title="Remover Recompensa">X</button>
                    </div>
                `;
                rewardList.appendChild(li);
            });

            // Renderizar Histórico
            const historyList = document.getElementById('historyList');
            if (historyList) {
                historyList.innerHTML = '';
                if (!state.history || state.history.length === 0) {
                    historyList.innerHTML = '<li style="text-align:center; color: var(--text-muted); padding: 10px;">Nenhum histórico ainda.</li>';
                } else {
                    state.history.forEach(log => {
                        const li = document.createElement('li');
                        li.className = 'history-item';
                        const isEarn = log.type === 'earn';
                        li.innerHTML = `
                            <span class="history-date">${log.date}</span>
                            <span class="history-name">${log.name}</span>
                            <span class="history-points ${isEarn ? 'earn' : 'spend'}">
                                ${isEarn ? '+' : '-'}${log.points} Pts
                            </span>
                        `;
                        historyList.appendChild(li);
                    });
                }
            }
        }

        function toggleHistory() {
            const panel = document.getElementById('historyPanel');
            const btn = document.getElementById('toggleHistoryBtn');
            if (panel.style.display === 'none') {
                panel.style.display = 'block';
                btn.innerText = 'Ocultar Detalhes';
            } else {
                panel.style.display = 'none';
                btn.innerText = 'Ver Detalhes';
            }
        }

        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebar.classList.contains('open')) {
                sidebar.classList.remove('open');
                overlay.classList.remove('open');
            } else {
                sidebar.classList.add('open');
                overlay.classList.add('open');
            }
        }

        function showTab(tabId) {
            document.getElementById('panelTarefas').style.display = (tabId === 'tarefas') ? 'block' : 'none';
            document.getElementById('panelRecompensas').style.display = (tabId === 'recompensas') ? 'block' : 'none';
            
            document.getElementById('tabTarefas').className = (tabId === 'tarefas') ? 'active' : '';
            document.getElementById('tabRecompensas').className = (tabId === 'recompensas') ? 'active' : '';
            
            toggleMenu();
        }

        // O app agora inicia automaticamente pelo auth.onAuthStateChanged
    </script>
</body>
</html>
